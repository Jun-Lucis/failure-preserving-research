<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="430" viewBox="0 0 1500 430" role="img" aria-labelledby="t d">
<title id="t">Failure-salvage spiral</title><desc id="d">A failed frozen hypothesis remains failed while retained data can influence a redesigned hypothesis and a fresh prospective test.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker>
<style>.b{fill:white;stroke:#222;stroke-width:1.5;rx:8}.t{font:15px Arial,Helvetica,sans-serif;fill:#111}.s{font:12px Arial,Helvetica,sans-serif;fill:#444}.l{stroke:#222;stroke-width:1.5;fill:none;marker-end:url(#a)}.d{stroke:#666;stroke-width:1.3;stroke-dasharray:5 4;fill:none;marker-end:url(#a)}</style></defs>
<rect width="1500" height="430" fill="white"/>
<text x="750" y="34" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700">Failure-salvage spiral: reuse without retroactive reclassification</text>
<g>
<rect x="30" y="115" width="120" height="55" class="b"/><text x="90" y="148" text-anchor="middle" class="t">Hypothesis H0</text>
<rect x="180" y="115" width="115" height="55" class="b"/><text x="238" y="148" text-anchor="middle" class="t">Frozen test</text>
<rect x="325" y="115" width="85" height="55" class="b"/><text x="368" y="148" text-anchor="middle" class="t">FAIL</text>
<rect x="440" y="105" width="170" height="75" class="b"/><text x="525" y="135" text-anchor="middle" class="t"><tspan x="525">Retain code + data</tspan><tspan x="525" dy="20">+ verdict</tspan></text>
<rect x="640" y="115" width="155" height="55" class="b"/><text x="718" y="140" text-anchor="middle" class="t"><tspan x="718">Later diagnostic</tspan><tspan x="718" dy="20">readout</tspan></text>
<rect x="825" y="115" width="135" height="55" class="b"/><text x="893" y="148" text-anchor="middle" class="t">Redesigned H1</text>
<rect x="990" y="115" width="135" height="55" class="b"/><text x="1058" y="148" text-anchor="middle" class="t">New frozen test</text>
<rect x="1155" y="115" width="115" height="55" class="b"/><text x="1213" y="148" text-anchor="middle" class="t">FAIL / limit</text>
<rect x="1300" y="115" width="145" height="55" class="b"/><text x="1373" y="148" text-anchor="middle" class="t">Retain again</text>
<path d="M150 142 H180" class="l"/><path d="M295 142 H325" class="l"/><path d="M410 142 H440" class="l"/><path d="M610 142 H640" class="l"/><path d="M795 142 H825" class="l"/><path d="M960 142 H990" class="l"/><path d="M1125 142 H1155" class="l"/><path d="M1270 142 H1300" class="l"/>
</g>
<path d="M1373 170 V245 H165" class="l"/>
<rect x="165" y="220" width="150" height="55" class="b"/><text x="240" y="253" text-anchor="middle" class="t">Conceptual pivot</text>
<rect x="355" y="220" width="180" height="55" class="b"/><text x="445" y="245" text-anchor="middle" class="t"><tspan x="445">New representation</tspan><tspan x="445" dy="20">H2</tspan></text>
<rect x="575" y="220" width="185" height="55" class="b"/><text x="668" y="245" text-anchor="middle" class="t"><tspan x="668">Fresh prospective</tspan><tspan x="668" dy="20">test</tspan></text>
<rect x="800" y="210" width="220" height="75" class="b"/><text x="910" y="240" text-anchor="middle" class="t"><tspan x="910">PASS or new</tspan><tspan x="910" dy="20">localized FAIL</tspan></text>
<path d="M315 247 H355" class="l"/><path d="M535 247 H575" class="l"/><path d="M760 247 H800" class="l"/>
<path d="M368 170 V320 H525 V180" class="d"/><text x="448" y="343" text-anchor="middle" class="s">parent verdict unchanged</text>
<path d="M1213 170 V350 H1373 V170" class="d"/><text x="1293" y="374" text-anchor="middle" class="s">retain again; do not rewrite</text>
<text x="750" y="407" text-anchor="middle" class="s">Old data may guide redesign as discovery data; the replacement claim requires a separately identified fresh or held-out evaluation.</text>
</svg>